name: build argocd-repo-server image

on:
  # pull_request:
  #   branches: [ "main" ]
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "1 1 * * *"
  workflow_dispatch:  
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: get argocd latest release tag
        id: argocd-version
        run: |
          # https://github.com/argoproj/argo-cd/releases/latest
          TAG=$(curl -s https://api.github.com/repos/argoproj/argo-cd/releases/latest | jq -r '.tag_name')
          echo "argocd-tag=${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Check if image tag exists on Docker Hub
        id: check-image
        run: |
          source .env
          TAG="${{ steps.argocd-version.outputs.tag }}"
          IMAGE="${REPOSITORIES}/argocd-repo-server:${TAG}"
          echo "Checking manifest for ${IMAGE}..."
          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "Image ${IMAGE} already exists. Skipping build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image ${IMAGE} does not exist. Proceeding with build."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: build argocd-repo-server image
        if: steps.check-image.outputs.exists != 'true'
        run: ARGOCD_VERSION=${{ steps.argocd-version.outputs.tag }} docker buildx bake -f argocd-repo-server.docker-compose.yaml --pull --push --progress plain --no-cache
